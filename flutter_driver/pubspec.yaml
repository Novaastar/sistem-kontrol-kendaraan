name: bank_jatim_driver
description: Aplikasi Android Driver Sistem Kontrol Kendaraan Bank Jatim Tuban.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  image_picker: ^1.2.3
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/img/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF" # Warna background ikon (bisa diganti kode hex lain)
  adaptive_icon_foreground: "assets/img/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/img/logo.png
    - assets/img/car.png
